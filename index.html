<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Star of Ash — Card Builder</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <header>
    <h1>Star of Ash — Card Builder</h1>
  </header>

  <section id="controls">
    <input type="file" id="csvUpload" accept=".csv" />
    <button id="toggleSnap">Snap: ON</button>
    <button id="exportCard">Export Card</button>
    <button id="exportSheet">Export 10x7 Sheet</button>
    <span style="color:#888; margin-left:10px;">*Sheet export may take a few seconds for full 70 cards</span>
  </section>

  <section id="workspace">

    <aside id="cardListPanel">
      <input type="text" id="cardSearch" placeholder="Search cards..." />
      <div id="cardList"></div>
    </aside>

    <div id="cardPreview">
      <div id="cardCanvas"></div>
    </div>

    <div id="editorPanel"></div>

  </section>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- JS Files -->
  <script src="js/app.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/templateEditor.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/export.js"></script>

  <!-- Sheet export listener -->
  <script>
    document.getElementById("exportSheet").addEventListener("click", () => {
      if (!cards || !cards.length) return;
      exportCardSheet(cards);
    });
  </script>

</body>
</html>
