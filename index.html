<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Star of Ash — Card Templater v6.29</title>
<style>
:root{
  --bg:#0b0b0c;--panel:#151517;--panel-2:#1b1b1f;--text:#eae7e4;
  --muted:#aaa6a2;--accent:#c0392b;--ash:#2b2b30;--blood:#8a1d1d;
  --flame:#b8571b;--border:#2b2b30;--ok:#57d38a;--warn:#ffb84d;--bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:16px;font-weight:600;margin:0}
header .tag{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.app{display:grid;grid-template-columns:280px 1fr 340px;gap:10px;height:100vh;padding:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;overflow:auto}
button{background:#18181b;color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
button.primary{background:var(--accent)}
button.danger{background:var(--bad)}
button.ok{background:var(--ok);color:#000}
input,select{background:#111;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;width:100%;font-size:13px;margin-top:2px}
input[type=range]{width:100%}
.small{font-size:11px;color:var(--muted)}
.section{margin-bottom:10px}
.stage{position:relative;width:744px;height:1039px;margin:0 auto;background:#111;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.frame-template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:5}
.name{position:absolute;left:89px;top:204px;right:24px;font-weight:800;font-size:34px;z-index:1200}
.type{position:absolute;left:90px;top:239px;right:24px;color:#fff;font-size:20px;z-index:1200}
.rules{position:absolute;left:238px;top:703px;right:24px;min-height:150px;font-size:16px;line-height:1.45;background:rgba(255,255,255,.03);
  padding:12px 14px;border-radius:10px;border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere;word-wrap:break-word;z-index:1200;}
.flavor{position:absolute;left:24px;right:24px;bottom:24px;font-size:12px;color:#c8c3bd;font-style:italic;z-index:1200}
.badge{position:absolute;z-index:1200;min-width:52px;height:52px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--border);
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;padding:0 10px}
#atk{left:143px;top:707px}
#hp{left:95px;top:771px}
#mov{left:164px;top:881px}
#cost{left:48px;top:49px;background:rgba(192,57,43,.38)}
.art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;z-index:900}
#diag{font-size:12px;color:var(--warn);margin-top:6px}
.queue-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.queue-thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--border);border-radius:6px}
</style>
</head>
<body>
<header>
  <h1>Star of Ash — Card Templater <span class="tag">v6.29</span></h1>
  <div>
    <button id="btn-export-png" class="primary">Export PNG</button>
    <button id="btn-save-layout">Save Layout</button>
    <button id="btn-load-layout">Load Layout</button>
    <button id="btn-reset" class="danger">Reset</button>
  </div>
</header>
<div class="app">
  <div class="panel">
    <div class="section">
      <h3>CSV / Images</h3>
      <input type="file" id="csvFile" accept=".csv"/><button id="btn-load-csv">Load CSV</button>
      <input type="file" id="imgFiles" multiple accept="image/*"/><button id="btn-load-imgs">Mass Import Images</button>
    </div>
    <div class="section">
      <h3>Card Frame Template</h3>
      <input type="file" id="frameTpl" accept="image/*"/>
    </div>
    <div class="section">
      <h3>Card Fields</h3>
      <label>Name<input id="fldName" type="text"></label>
      <label>Type<input id="fldType" type="text"></label>
      <label>Rules<textarea id="fldRules" rows="5" style="width:100%;background:#111;color:var(--text);border:1px solid var(--border);border-radius:6px;"></textarea></label>
      <label>Flavor<input id="fldFlavor" type="text"></label>
    </div>
    <div class="section">
      <h3>Stats</h3>
      <label>ATK<input id="fldAtk" type="text"></label>
      <label>HP<input id="fldHp" type="text"></label>
      <label>MOV<input id="fldMov" type="text"></label>
      <label>Cost<input id="fldCost" type="text"></label>
    </div>
    <div class="section">
      <h3>Card Queue</h3>
      <button id="btn-add-queue" class="ok">Add Current to Queue</button>
      <button id="btn-save-queue">Save Queue</button>
      <button id="btn-export-queue" class="primary">Export Queue PNGs</button>
      <button id="btn-clear-queue" class="danger">Clear Queue</button>
      <div id="diag"></div>
      <div class="queue-thumbs" id="queue-thumbs"></div>
    </div>
  </div>

  <div class="panel center">
    <div class="stage" id="stage">
      <img id="frame" class="frame-template" alt="">
      <img id="art" class="art" alt="">
      <div id="name" class="name">Name</div>
      <div id="type" class="type">Type — Subtype</div>
      <div id="rules" class="rules">Rules text...</div>
      <div id="flavor" class="flavor">Flavor text...</div>
      <div id="atk" class="badge">1</div>
      <div id="hp" class="badge">40</div>
      <div id="mov" class="badge">1</div>
      <div id="cost" class="badge">1</div>
    </div>
  </div>

  <div class="panel">
    <h3>Controls</h3>
    <button id="btn-prev">Prev</button>
    <button id="btn-next">Next</button>
    <div id="pos" class="small"></div>
  </div>
</div>

<script>
const q=s=>document.querySelector(s);
const setDiag=m=>q('#diag').textContent=m;
let state={rows:[],index:0,queue:[],images:new Map(),frame:null};

function sniffDelim(sample){const c={',':0,';':0,'\t':0,'|':0};for(const k in c)c[k]=(sample.match(new RegExp(k,'g'))||[]).length;return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]||',';}
function parseCSV(t){
  t=String(t||'').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const delim=sniffDelim(t);
  const rows=[];let row=[],cell='',inQ=false;
  const pushC=()=>{row.push(cell);cell='';};const pushR=()=>{rows.push(row);row=[];};
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(ch=='"'){if(inQ&&t[i+1]=='"'){cell+='"';i++;}else inQ=!inQ;continue;}
    if(ch==delim&&!inQ){pushC();continue;}
    if(ch=='\n'&&!inQ){pushC();pushR();continue;}
    cell+=ch;
  }pushC();if(row.length)pushR();
  const header=rows.shift().map(s=>s.trim());
  return rows.map(r=>{const o={};header.forEach((h,i)=>o[h]=r[i]||'');return o;});
}
q('#btn-load-csv').onclick=()=>q('#csvFile').click();
q('#csvFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();fr.onload=()=>{
    state.rows=parseCSV(fr.result);state.index=0;
    applyRow();updatePos();
    setDiag(`Loaded ${state.rows.length} rows.`);
  };fr.readAsText(f);
};

function applyRow(){
  if(!state.rows.length)return;
  const r=state.rows[state.index];
  q('#fldName').value=q('#name').textContent=r.Name||'';
  q('#fldType').value=q('#type').textContent=r.Type||'';
  q('#fldRules').value=q('#rules').textContent=(r.Rules||'');
  q('#fldFlavor').value=q('#flavor').textContent=r.Flavor||'';
  q('#fldAtk').value=q('#atk').textContent=r.ATK||'';
  q('#fldHp').value=q('#hp').textContent=r.HP||'';
  q('#fldMov').value=q('#mov').textContent=r.MOV||'';
  q('#fldCost').value=q('#cost').textContent=r.Cost||'';
  const img=state.images.get((r.Name||'').trim().toLowerCase());
  if(img)q('#art').src=img;
}
function updatePos(){q('#pos').textContent=`${state.index+1}/${state.rows.length}`;}
q('#btn-next').onclick=()=>{if(state.index<state.rows.length-1){state.index++;applyRow();updatePos();}};
q('#btn-prev').onclick=()=>{if(state.index>0){state.index--;applyRow();updatePos();}};

q('#imgFiles').onchange=e=>{
  const files=[...e.target.files];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{state.images.set(f.name.replace(/\.[^.]+$/,'').toLowerCase(),r.result);};
    r.readAsDataURL(f);
  });
  setDiag(`Imported ${files.length} images`);
};
q('#frameTpl').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{q('#frame').src=r.result;state.frame=r.result;};
  r.readAsDataURL(f);
};

// Inline all images for safe rendering
async function inlineStageImages(){
  const imgs=[...document.querySelectorAll('#stage img')];
  await Promise.all(imgs.map(img=>new Promise(res=>{
    if(!img.src.startsWith('data:')){fetch(img.src).then(r=>r.blob()).then(b=>{
      const fr=new FileReader();fr.onload=()=>{img.src=fr.result;res();};fr.readAsDataURL(b);
    }).catch(()=>res());}else res();
  })));
}

// Exporter
async function domToPng(node){
  await inlineStageImages();
  const w=node.offsetWidth,h=node.offsetHeight;
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const clone=node.cloneNode(true);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
  <foreignObject width="100%" height="100%">
  <div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${clone.outerHTML}</div></foreignObject></svg>`;
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0);res(c.toDataURL('image/png'));
    };
    img.onerror=()=>rej('SVG rasterize error');
    img.src=url;
  });
}
q('#btn-export-png').onclick=async()=>{
  setDiag('Rendering...');
  try{
    const data=await domToPng(q('#stage'));
    const a=document.createElement('a');
    a.href=data;a.download='card.png';a.click();
    setDiag('Rendered PNG.');
  }catch(e){setDiag('Render failed: '+e);}
};

// Queue
q('#btn-add-queue').onclick=async()=>{
  try{
    const png=await domToPng(q('#stage'));
    state.queue.push(png);
    const thumb=document.createElement('img');
    thumb.src=png;
    q('#queue-thumbs').appendChild(thumb);
    setDiag(`Added to queue (${state.queue.length})`);
  }catch(e){setDiag('Queue render failed: '+e);}
};
q('#btn-clear-queue').onclick=()=>{state.queue=[];q('#queue-thumbs').innerHTML='';};
q('#btn-save-queue').onclick=()=>{
  const a=document.createElement('a');
  const blob=new Blob([JSON.stringify(state.queue)],{type:'application/json'});
  a.href=URL.createObjectURL(blob);a.download='queue.json';a.click();
};
q('#btn-export-queue').onclick=()=>{
  const zip=new JSZip();state.queue.forEach((p,i)=>{zip.file(`card_${i+1}.png`,p.split(',')[1],{base64:true});});
  zip.generateAsync({type:'blob'}).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='queue.zip';a.click();});
};
q('#btn-reset').onclick=()=>location.reload();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
